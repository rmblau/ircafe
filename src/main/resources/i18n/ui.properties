# Network preferences
preferences.network.title=Network
preferences.network.help.title=Network settings
preferences.network.help.message=These settings affect how IRCafe connects to networks and fetches external content (link previews, embedded images, etc).\n\nTip: Most users only touch Proxy. Leave TLS trust-all off unless you're debugging.
preferences.network.tab.proxy=Proxy
