preferences.logging.redactionAudit.enabled=Store original text for redacted messages in audit log
preferences.logging.redactionAudit.tooltip=If enabled, IRCafe stores the original pre-redaction text in a separate audit table,\nwhile the normal chat log keeps only the [message redacted] placeholder.\nUse this only if you explicitly want local audit retention of redacted content.
preferences.logging.privateMessages.enabled=Save private-message history
preferences.logging.privateMessages.tooltip=If enabled, PM/query messages are stored in the local history database.\nIf disabled, only non-PM targets are persisted.
preferences.logging.privateMessageList.enabled=Save private-message chat list
preferences.logging.privateMessageList.tooltip=If enabled, PM/query targets are remembered and re-opened after reconnect/restart.\nThe per-server PM list is managed in Servers -> Edit -> Auto-Join.
preferences.logging.keepForever.enabled=Keep chat history forever (no retention pruning)
preferences.logging.keepForever.tooltip=If enabled, IRCafe will never automatically delete old chat history.\nIf disabled, you can set a retention window in days to prune older rows.\n\nNote: retention pruning runs only when logging is enabled and takes effect after restart.
preferences.logging.retentionDays.tooltip=Retention window in days (0 disables retention).\nOnly used when Keep forever is unchecked.\n\nNote: applied on next restart.
preferences.logging.writerQueueMax.tooltip=Maximum buffered log lines before new lines are dropped.\nHigher values reduce drop risk during bursts but use more memory.\n\nNote: applied on next restart.
preferences.logging.writerBatchSize.tooltip=How many queued log lines are written per DB transaction.\nLarger batches improve write throughput, smaller batches reduce commit latency.\n\nNote: applied on next restart.
preferences.logging.dbBaseName.tooltip=Base filename for HSQLDB (no extension).\nHSQLDB will create multiple files like .data/.script/.properties.
preferences.logging.dbNextToConfig.enabled=Store DB next to runtime config file
preferences.logging.dbNextToConfig.tooltip=If enabled, the DB files are stored alongside your runtime YAML config (recommended).\nIf disabled, IRCafe uses the default runtime-config directory\n(XDG_CONFIG_HOME/ircafe when set, otherwise ~/.config/ircafe).
preferences.logging.info=Logging settings are applied on the next restart.\nTip: You can enable logging first, restart, then history controls (Load older messages…) will appear when data exists.
