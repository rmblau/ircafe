def libsCatalog = extensions.getByType(org.gradle.api.artifacts.VersionCatalogsExtension).named("libs")
def catalogVersion = { String alias -> libsCatalog.findVersion(alias).get().requiredVersion }
def javaRelease = project.ext.javaRelease

def errorPronePatchChecks =
    (findProperty('errorPronePatchChecks')
            ?: 'CheckReturnValue,ReturnValueIgnored,SelfAssignment,MisleadingEscapedSpace,DuplicateBranches,UnnecessaryParentheses,DeprecatedVariable,UnusedVariable')
        .toString()

def javaFormattingTargets = [
    'src/**/*.java',
    'ircafe-*/src/**/*.java'
]

def projectJavaSources = providers.provider {
    rootProject.allprojects.collectMany { candidate ->
        candidate.fileTree('src') {
            include '**/*.java'
        }.files
    }
}

def formattedJavaSources = providers.provider {
    rootProject.fileTree(rootProject.projectDir) {
        include(javaFormattingTargets)
    }.files
}

spotless {
    java {
        target javaFormattingTargets
        googleJavaFormat(catalogVersion("googleJavaFormat"))
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    format("misc") {
        target "*.md", ".gitignore", "gradle.properties", "settings.gradle", "build.gradle", "gradle/**/*.gradle"
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = providers.gradleProperty("checkstyleVersion").getOrElse(catalogVersion("checkstyle"))
}

def googleCheckstyleArchive = providers.provider {
    configurations.checkstyle
        .resolve()
        .find { it.name.startsWith("checkstyle-") && it.name.endsWith(".jar") }
}
tasks.withType(Checkstyle).configureEach {
    enabled = false
    config = resources.text.fromArchiveEntry(googleCheckstyleArchive.get(), "google_checks.xml")
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.matching { it.name.toLowerCase().startsWith('spotbugs') }.configureEach {
    def confidenceClass = it.class.classLoader.loadClass('com.github.spotbugs.snom.Confidence')
    reportLevel.set(Enum.valueOf(confidenceClass, 'HIGH'))
    excludeFilter.set(rootProject.layout.projectDirectory.file('config/spotbugs/exclude.xml'))
    reports {
        html.required = true
        xml.required = false
    }
}

tasks.register('errorProneApplyMain', JavaCompile) {
    group = 'formatting'
    description = 'Applies Error Prone auto-fixes in-place for main Java sources.'
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(javaRelease)
    }
    source = sourceSets.main.java
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('tmp/errorproneApplyMain')
    options.annotationProcessorPath = configurations.annotationProcessor
    options.generatedSourceOutputDirectory =
        layout.buildDirectory.dir('generated/sources/annotationProcessor/java/errorProneApplyMain')
    options.errorprone.enabled = true
    options.errorprone.errorproneArgs.addAll([
        "-XepPatchChecks:${errorPronePatchChecks}",
        '-XepPatchLocation:IN_PLACE'
    ])
}

tasks.register('errorProneApply') {
    group = 'formatting'
    description =
        'Runs Error Prone in-place auto-fixes. Override checks with -PerrorPronePatchChecks=Check1,Check2.'
    dependsOn('errorProneApplyMain')
}

tasks.register('strictCompileMain', JavaCompile) {
    group = 'verification'
    description = 'Compiles main Java sources with javac lint warnings elevated to errors.'
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(javaRelease)
    }
    source = sourceSets.main.java
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('tmp/strictCompileMain')
    options.annotationProcessorPath = configurations.annotationProcessor
    options.generatedSourceOutputDirectory =
        layout.buildDirectory.dir('generated/sources/annotationProcessor/java/strictCompileMain')
    options.release = javaRelease
    options.warnings = true
    options.compilerArgs.removeAll { it.startsWith('-Xlint') || it == '-Werror' }
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
    options.errorprone.enabled = false
}

tasks.register('errorProneCheckMain', JavaCompile) {
    group = 'verification'
    description = 'Runs Error Prone checks for main Java sources without applying patches.'
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(javaRelease)
    }
    source = sourceSets.main.java
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('tmp/errorProneCheckMain')
    options.annotationProcessorPath = configurations.annotationProcessor
    options.generatedSourceOutputDirectory =
        layout.buildDirectory.dir('generated/sources/annotationProcessor/java/errorProneCheckMain')
    options.release = javaRelease
    options.errorprone.enabled = true
}

tasks.register('strictAnalysis') {
    group = 'verification'
    description = 'Runs opt-in stricter compile and static-analysis checks for main sources.'
    dependsOn(
        'strictCompileMain',
        'errorProneCheckMain',
        'spotlessCheck',
        'spotbugsMain',
        'forbiddenApisMain'
    )
}

tasks.named('spotlessApply') {
    dependsOn('errorProneApply')
}

tasks.register('applyFormatting') {
    group = 'formatting'
    description = 'Applies Spotless formatting without running Error Prone auto-fixes.'
    dependsOn('spotlessJavaApply', 'spotlessMiscApply')
}

tasks.named('spotlessCheck') {
    mustRunAfter('errorProneApply')
}

tasks.register('verifyJavaFormattingCoverage') {
    group = 'verification'
    description = 'Verifies that Spotless targets every Java source file in registered Gradle projects.'
    inputs.files(projectJavaSources)
    inputs.files(formattedJavaSources)

    doLast {
        Set<File> registeredSources = new LinkedHashSet<>(projectJavaSources.get())
        Set<File> formattedSources = new LinkedHashSet<>(formattedJavaSources.get())
        List<String> missingSources = registeredSources
            .findAll { !formattedSources.contains(it) }
            .collect { rootProject.relativePath(it) }
            .sort()

        if (!missingSources.isEmpty()) {
            throw new GradleException(
                'Spotless Java targets do not cover registered project sources:\n - '
                    + missingSources.join('\n - ')
            )
        }
    }
}

tasks.register('spotlessLint') {
    group = 'formatting'
    description = 'Runs Error Prone auto-fixes first, then Spotless lint checks.'
    dependsOn('errorProneApply', 'spotlessCheck')
}

tasks.register("lint") {
    group = "verification"
    description = "Runs formatting, style, and static analysis checks."
    dependsOn(
        "spotlessCheck",
        "checkstyleMain",
        "checkstyleTest",
        "spotbugsMain",
        "forbiddenApisMain",
        "forbiddenApisTest"
    )
}
tasks.named("check") { dependsOn("lint", "verifyJavaFormattingCoverage") }

dependencyCheck {
    failBuildOnCVSS = 8.0
    formats = ["HTML", "JSON"]
    suppressionFile = "config/dependency-check-suppressions.xml"
}

dependencyAnalysis {
    issues {
        all {
            onAny {
                severity("fail")
            }
        }
    }
}

tasks.named("cyclonedxDirectBom") {
    includeConfigs = ["runtimeClasspath"]

    // Gradle 9 validates task input provenance more strictly. The CycloneDX task
    // resolves runtimeClasspath and reads project-dependency JARs directly, so make
    // those producer tasks explicit instead of relying on incidental task order.
    dependsOn(provider {
        configurations.runtimeClasspath.dependencies
            .withType(org.gradle.api.artifacts.ProjectDependency)
            .collect { it.dependencyProject.tasks.named("jar") }
    })

    jsonOutput = file("$buildDir/reports/ircafe-sbom.json")
}

// Gradle 9 validates task input provenance more strictly. The CycloneDX direct
// BOM task resolves runtimeClasspath and reads project-dependency JAR files, but
// the plugin keeps those files as plain inputs instead of preserving producer
// task metadata. Bind the root task to every Java subproject JAR after all
// projects have been evaluated so feature and builtins modules added later do
// not create another implicit-dependency failure.
gradle.projectsEvaluated {
    tasks.named("cyclonedxDirectBom") {
        dependsOn(
            rootProject.subprojects
                .findAll { it.tasks.findByName("jar") != null }
                .collect { it.tasks.named("jar") }
        )
    }
}

tasks.named("cyclonedxBom") {
    jsonOutput = file("$buildDir/reports/ircafe-sbom-aggregate.json")
}

if (System.getenv("CI") == "true") {
    tasks.named("check") { dependsOn("dependencyCheckAnalyze") }
}

forbiddenApis {
    // Keep this task configured so it fails on accidental shell execution shortcuts.
    signatures = [
        "java.lang.Runtime#exec(java.lang.String)",
        "java.lang.Runtime#exec(java.lang.String[])"
    ]
}
