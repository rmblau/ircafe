plugins {
    id 'java-library'
}

group = rootProject.group
description = 'Stable IRCafe plugin-facing SPI contracts.'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.ext.javaRelease)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = rootProject.ext.javaRelease
    options.warnings = false
    options.compilerArgs.removeAll { it.startsWith('-Xlint') }
    options.compilerArgs += ['-Xlint:none']
}
